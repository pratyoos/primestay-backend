services:
  postgres:
    image: postgres:19
    container_name: primestay_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5445:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata: